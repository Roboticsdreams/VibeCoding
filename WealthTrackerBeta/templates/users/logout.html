{% extends "base.html" %}
{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="text-center mb-0">Logged Out</h2>
            </div>
            <div class="card-body p-4 text-center">
                <p class="lead">You have been successfully logged out.</p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-outline-primary">Log In Again</a>
                    <a href="{% url 'landing' %}" class="btn btn-outline-secondary ms-2">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
