<a href="{{ category.get_absolute_url }}" class="bg-white rounded-2xl p-8 text-center hover:shadow-xl transition-all duration-300 group border border-gray-100">
    <div class="w-24 h-24 bg-gradient-to-br from-primary-100 to-primary-200 rounded-full flex items-center justify-center mx-auto mb-5 group-hover:scale-110 transition-transform duration-300">
        <span class="text-5xl">{{ category.icon_class }}</span>
    </div>
    <h3 class="text-lg font-bold text-gray-900 mb-2 group-hover:text-primary-600 transition-colors">
        {{ category.name }}
    </h3>
    <p class="text-gray-500 text-sm">{{ category.course_count }} Courses</p>
</a>
