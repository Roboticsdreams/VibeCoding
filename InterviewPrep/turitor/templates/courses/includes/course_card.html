<div class="card group h-full flex flex-col">
    <div class="relative overflow-hidden">
        <img src="{{ course.image_url }}" alt="{{ course.title }}" 
             class="w-full h-48 object-cover transition-transform duration-300 group-hover:scale-110">
        <div class="absolute top-4 left-4">
            <span class="bg-primary-600 text-white px-3 py-1 rounded-full text-xs font-medium">
                {{ course.category.name }}
            </span>
        </div>
    </div>
    <div class="p-5 flex flex-col flex-grow">
        <div class="flex items-center mb-3">
            <div class="flex items-center text-yellow-400">
                {% for i in course.get_star_range %}
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                    <path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/>
                </svg>
                {% endfor %}
                <span class="ml-1.5 text-gray-600 text-sm font-medium">({{ course.rating }})</span>
            </div>
        </div>
        <h3 class="text-lg font-bold text-gray-900 mb-3 line-clamp-2 min-h-[3.5rem] group-hover:text-primary-600 transition-colors">
            <a href="{{ course.get_absolute_url }}">{{ course.title }}</a>
        </h3>
        <div class="flex items-center justify-between text-sm text-gray-600 mb-4 flex-wrap gap-2">
            <div class="flex items-center">
                <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <span class="whitespace-nowrap">{{ course.lessons_count }} Lessons</span>
            </div>
            <div class="flex items-center">
                <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <span class="whitespace-nowrap">{{ course.students_count }} Students</span>
            </div>
        </div>
        <div class="flex items-center justify-between pt-4 border-t border-gray-200 mt-auto">
            <div class="text-2xl font-bold text-primary-600">
                ${{ course.price }}
            </div>
            <a href="{{ course.get_absolute_url }}" 
               class="btn btn-primary text-sm py-2 px-5">
                Enroll Now
            </a>
        </div>
    </div>
</div>
