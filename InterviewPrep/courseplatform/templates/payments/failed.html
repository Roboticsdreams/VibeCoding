{% extends 'base.html' %}

{% block title %}Payment Failed{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <i class="bi bi-x-circle display-1 text-danger"></i>
                    <h2 class="mt-4">Payment Failed</h2>
                    <p class="lead">Unfortunately, your payment could not be processed.</p>
                    <p class="text-muted">Please try again or contact support if the issue persists.</p>
                    
                    <div class="mt-4">
                        <a href="{% url 'courses:list' %}" class="btn btn-primary">
                            <i class="bi bi-arrow-left"></i> Back to Courses
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
