{% extends 'base.html' %}

{% block title %}Password Reset Sent - Course Platform{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <i class="bi bi-envelope-check display-1 text-success"></i>
                    <h2 class="mt-3">Check Your Email</h2>
                    <p class="text-muted">We've sent you instructions for resetting your password. Please check your email.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
