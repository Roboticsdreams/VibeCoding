{% extends 'base.html' %}

{% block title %}Password Reset Complete - Course Platform{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <i class="bi bi-check-circle display-1 text-success"></i>
                    <h2 class="mt-3">Password Reset Complete</h2>
                    <p class="text-muted">Your password has been reset successfully. You can now login with your new password.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
